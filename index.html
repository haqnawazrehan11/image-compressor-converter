<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Free online image compressor and converter. Convert JPG, PNG and WebP images directly in your browser."
  >

  <meta
    name="keywords"
    content="image compressor, image converter, JPG to WebP, PNG to WebP, WebP converter"
  >

  <title>Image Compressor & Converter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div class="container">

      <h1>Image Compressor & Converter</h1>

      <p>
        Compress and convert JPG, PNG and WebP images directly in your browser.
      </p>

    </div>
  </header>

  <main class="container">

    <section class="tool-card">

      <div class="upload-area" id="dropArea">

        <div class="upload-icon">📷</div>

        <h2>Upload Your Images</h2>

        <p>
          Drag & drop images here or choose files from your device.
        </p>

        <label class="upload-btn" for="fileInput">
          Choose Images
        </label>

        <input
          type="file"
          id="fileInput"
          accept="image/jpeg,image/png,image/webp"
          multiple
          hidden
        >

        <small>
          Supported: JPG, JPEG, PNG, WebP
        </small>

      </div>

      <div class="settings">

        <div class="setting-group">

          <label for="format">
            Convert To
          </label>

          <select id="format">

            <option value="image/webp">
              WebP
            </option>

            <option value="image/jpeg">
              JPG
            </option>

            <option value="image/png">
              PNG
            </option>

          </select>

        </div>

        <div class="setting-group">

          <label for="quality">
            Quality:
            <span id="qualityValue">80</span>%
          </label>

          <input
            type="range"
            id="quality"
            min="10"
            max="100"
            value="80"
          >

        </div>

        <div class="setting-group">

          <label for="maxWidth">
            Maximum Width
          </label>

          <input
            type="number"
            id="maxWidth"
            placeholder="Original size"
            min="100"
          >

        </div>

      </div>

      <div class="action-buttons">

        <button
          id="convertBtn"
          class="primary-btn"
          disabled
        >
          Convert & Compress
        </button>

        <button
          id="clearBtn"
          class="secondary-btn"
        >
          Clear All
        </button>

      </div>

    </section>

    <section
      id="resultsSection"
      class="results-section hidden"
    >

      <div class="results-header">

        <h2>
          Converted Images
        </h2>

        <button
          id="downloadAllBtn"
          class="download-all-btn"
        >
          Download All
        </button>

      </div>

      <div id="results"></div>

    </section>

  </main>

  <footer>

    <p>
      © 2026 Image Compressor & Converter.
      All rights reserved.
    </p>

  </footer>

  <script src="script.js"></script>

</body>
</html>
